# Same pipeline as templates/config-maps/cm-telegraf.yaml in the Helm chart:
# Ditto twin events (published by the mosquitto-target connection on
# opentwins/#) are flattened into InfluxDB. ${VARS} come from the environment.
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "opentwins"
  bucket = "default"
  timeout = "120s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["opentwins/twin/events/#"]
  qos = 1
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "extra.attributes._parents"
      rename = "parent"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "extra.thingId"
      rename = "thingId"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "headers.ditto-originator"
      rename = "originator"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "headers.correlation-id"
      rename = "correlationId"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "extra.features.idSimulationRun.properties.value"
      rename = "idSimulationRun"
      optional = true
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "{value}"
      optional = true
      excluded_keys = ["value_thingId", "value_policyId", "value_attributes", "value_features"]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = '{"value":value.features}'
      optional = true

# Our frame events already contain every feature. Derive identity from the
# Ditto protocol topic instead of requiring a second Thing lookup per event.
[[inputs.mqtt_consumer]]
  name_override = "team050_raw"
  servers = ["tcp://mosquitto:1883"]
  topics = ["team050/ditto/twin/events/#"]
  qos = 1
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "topic"
      rename = "ditto_topic"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "value.idSimulationRun.properties.value"
      rename = "idSimulationRun"
      optional = true
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "{value}"
      optional = true
      excluded_keys = ["value_thingId", "value_policyId", "value_attributes", "value_features"]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = '{"value":value.features}'
      optional = true

[[processors.starlark]]
  namepass = ["mqtt_consumer", "team050_raw"]
  source = '''
def apply(metric):
    if metric.name == "team050_raw":
        parts = metric.tags["ditto_topic"].split("/")
        if len(parts) < 2 or parts[0] != "org.openegiz.team050":
            return None
        del metric.tags["ditto_topic"]
        metric.tags["thingId"] = parts[0] + ":" + parts[1]
        if parts[1] != "mine-01":
            metric.tags["parent"] = parts[0] + ":mine-01"
        metric.name = "mqtt_consumer"
        return metric
    # Avoid duplicate history if the generic enriched target also recovers.
    if metric.tags.get("thingId", "").startswith("org.openegiz.team050:"):
        return None
    return metric
'''
